name: Traffic forwarder tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sockets:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: python3 -B -m unittest -v test_traffic_forwarder
